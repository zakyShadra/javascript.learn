<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Profile Card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Interactive Profile Card</h1>

    <p id="status" role="status" aria-live="polite">
      Memuat profil...
    </p>

    <button id="coba-lagi" type="button" hidden>Coba lagi</button>

    <section id="kartu-profil" class="kartu" hidden>
      <div class="kartu-header">
        <div>
          <h2 id="nama-profil"></h2>
          <p id="peran-profil"></p>
        </div>
        <button id="toggle-tema" type="button">Ganti tema</button>
      </div>

      <button id="toggle-detail" type="button" aria-expanded="false"
              aria-controls="detail-profil">
        Lihat detail
      </button>
      <p id="detail-profil" hidden></p>

      <h3>Keterampilan</h3>
      <ul id="daftar-skill" class="skill-list"></ul>
      <p id="pesan-skill-kosong" hidden>Belum ada keterampilan yang tercatat.</p>

      <form id="form-skill">
        <label for="skill-baru">Tambah keterampilan</label>
        <input id="skill-baru" name="skill-baru" placeholder="Contoh: Git">
        <small id="error-skill" class="error"></small>
        <button type="submit">Tambah</button>
      </form>
    </section>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
