<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independent Challenge 3 - Tips Loader</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Tips Belajar Acak</h1>

    <p id="status" class="status" data-state="idle" role="status" aria-live="polite">
      Tekan tombol untuk memuat satu tips secara acak.
    </p>

    <button id="muat-data" type="button">Muat Data</button>
    <button id="coba-lagi" type="button" hidden>Coba Lagi</button>

    <p id="tampilan-tips" class="tips" hidden></p>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
